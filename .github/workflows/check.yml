name: Checks
# Manual checks: no automatic hosted-runner usage or billing on push.
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y jq
      - run: PYTHONPATH=app python -m unittest discover -s tests
      - run: python scripts/release_check.py
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: .\scripts\check-powershell.ps1
  mac-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/build-macos.sh
